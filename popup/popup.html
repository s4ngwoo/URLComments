<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URLComments</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <!-- Header 영역 -->
    <header class="app-header">
      <div class="brand">
        <span class="logo-icon">💬</span>
        <h1 class="app-title" data-i18n="appName">URLComments</h1>
      </div>
      <div id="auth-status" class="auth-status">
        <button id="btn-login" class="btn btn-primary btn-sm" data-i18n="btnLogin">Google 로그인</button>
        <div id="user-profile" class="user-profile hidden">
          <span id="user-email" class="user-email" title=""></span>
          <button id="btn-logout" class="btn btn-outline btn-xs" data-i18n="btnLogout">로그아웃</button>
        </div>
      </div>
    </header>

    <!-- 에러 알림 배너 -->
    <div id="error-banner" class="error-banner hidden">
      <span id="error-message" class="error-message"></span>
      <button id="btn-close-error" class="btn-close-error">&times;</button>
    </div>

    <!-- 현재 정규화된 URL 표시 바 -->
    <div id="url-bar" class="url-bar hidden">
      <span class="url-label" data-i18n="urlLabel">현재 페이지:</span>
      <span id="current-url" class="url-text" title="">-</span>
    </div>

    <!-- Content Area 영역 -->
    <main class="app-content">
      <!-- 1. 로딩 상태 -->
      <div id="state-loading" class="state-view">
        <div class="spinner"></div>
        <p id="loading-text" class="state-message" data-i18n="stateLoading">댓글을 불러오는 중...</p>
      </div>

      <!-- 2. 미지원 페이지 안내 -->
      <div id="state-unsupported" class="state-view hidden">
        <div class="state-icon">⚠️</div>
        <p class="state-title" data-i18n="stateUnsupportedTitle">지원을 안 하는 페이지입니다</p>
        <p class="state-desc" data-i18n="stateUnsupportedDesc">HTTP/HTTPS 웹 페이지에서만 URLComments를 사용할 수 있습니다.</p>
      </div>

      <!-- 3. 빈 댓글 상태 -->
      <div id="state-empty" class="state-view hidden">
        <div class="state-icon">🎁</div>
        <p class="state-title" data-i18n="stateEmptyTitle">아직 작성된 댓글이 없습니다</p>
        <p class="state-desc" data-i18n="stateEmptyDesc">이 URL의 첫 번째 보물 댓글을 남겨보세요!</p>
      </div>

      <!-- 4. 댓글 목록 상태 -->
      <div id="state-list" class="state-view hidden">
        <ul id="comment-list" class="comment-list">
          <!-- JS로 동적 댓글 아이템 삽입 -->
        </ul>
      </div>
    </main>

    <!-- Footer 영역 (댓글 작성) -->
    <footer id="app-footer" class="app-footer">
      <form id="comment-form" class="comment-form">
        <div class="textarea-wrapper">
          <textarea 
            id="comment-input" 
            data-i18n-placeholder="inputPlaceholder"
            placeholder="댓글을 작성해 보세요 (최대 1000자)" 
            maxlength="1000"
            rows="3"
            disabled
          ></textarea>
          <span id="char-count" class="char-count">0 / 1000</span>
        </div>
        <div class="form-bottom">
          <span id="form-auth-notice" class="auth-notice" data-i18n="authNoticeDefault">로그인 후 댓글을 작성할 수 있습니다.</span>
          <button type="submit" id="btn-submit" class="btn btn-submit" data-i18n="btnSubmit" disabled>등록</button>
        </div>
      </form>
    </footer>
  </div>

  <!-- 라이브러리 및 스크립트 로드 순서 준수 -->
  <script src="../lib/config.js"></script>
  <script src="../lib/supabase.js"></script>
  <script src="../lib/supabaseClient.js"></script>
  <script src="../utils/urlHelper.js"></script>
  <script src="popup.js"></script>
</body>
</html>
