name: Build & Release Extension

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Package Extension & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run automated tests
        run: npm test

      - name: Prepare lib/config.js
        run: |
          if [ ! -f lib/config.js ]; then
            echo "Copying default configuration template to lib/config.js..."
            cp lib/config.example.js lib/config.js
          fi

      - name: Extract version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "release" ] && [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(node -p "require('./manifest.json').version")
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building URLComments extension version v${VERSION}"

      - name: Package extension into ZIP archives
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          zip -r "URLComments-v${VERSION}.zip" manifest.json background.js popup content lib _locales assets utils -x "*.test.js" "*__tests__*" "*.DS_Store*"
          cp "URLComments-v${VERSION}.zip" "URLComments.zip"
          echo "Created distribution archives:"
          ls -lh URLComments*.zip

      - name: Upload artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: URLComments-v${{ steps.get_version.outputs.version }}
          path: URLComments*.zip
          retention-days: 30

      - name: Attach ZIP assets to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            URLComments-v${{ steps.get_version.outputs.version }}.zip
            URLComments.zip
          generate_release_notes: true
          body: |
            ## 🚀 URLComments v${{ steps.get_version.outputs.version }}

            ### 📦 Quick Installation
            1. Download **`URLComments-v${{ steps.get_version.outputs.version }}.zip`** below and unzip it.
            2. In Google Chrome, navigate to `chrome://extensions` and enable **Developer mode** (top right).
            3. Click **Load unpacked** and select the unzipped folder.
            4. Pin URLComments to your browser toolbar and start commenting!

            ---
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
